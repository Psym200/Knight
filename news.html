<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronique de l'Arche - Journal de Susan Anders</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=Inter:wght@300;400;600;700&family=Cinzel:wght@400;600;700;900&family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-table:     #14110e;
            --bg-panel:     #231c15;
            --bg-parchment: #faf4e5;
            --bg-input:     #1b1510;
            --border-gold:  #c3a163;
            --border-iron:  #4a3e35;
            --text-dark:    #2a2015;
            --text-light:   #e6dfd3;
            --text-muted:   #8c765c;
            /* Priorités */
            --prio-red:    #b91c1c;
            --prio-orange: #c2410c;
            --prio-green:  #15803d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-table);
            color: var(--text-light);
            font-family: 'EB Garamond', serif;
            font-size: 1.1rem;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: radial-gradient(rgba(0,0,0,0.4) 20%, transparent 80%),
                              linear-gradient(to right, rgba(255,255,255,0.01) 1px, transparent 1px);
        }

        /* Header — identique au bestiaire */
        .app-header {
            background: linear-gradient(180deg, #1b1510 0%, #120e0a 100%);
            border-bottom: 3px double var(--border-gold);
            padding: 12px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 80px;
            width: 100%;
            position: fixed;
            top: 0; left: 0;
            z-index: 100;
        }
        .app-title {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--border-gold);
            font-size: 1.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .app-subtitle {
            font-family: 'EB Garamond', serif;
            font-style: italic;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .main-wrapper {
            display: flex;
            width: 100%;
            height: calc(100vh - 80px);
            margin-top: 80px;
        }

        /* Sidebar — même style que le bestiaire */
        .sidebar {
            width: 380px;
            background-color: var(--bg-panel);
            border-right: 3px double var(--border-iron);
            display: flex;
            flex-direction: column;
            height: 100%;
            flex-shrink: 0;
        }
        .sidebar-search {
            padding: 15px;
            border-bottom: 1px solid var(--border-iron);
        }
        .custom-input {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-iron);
            color: var(--text-light);
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 1rem;
            outline: none;
            font-family: 'EB Garamond', serif;
            transition: border-color 0.2s;
        }
        .custom-input:focus { border-color: var(--border-gold); }

        .articles-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Cartes d'articles — style parchemin */
        .article-card {
            background-color: #1a1410;
            border: 1px solid var(--border-iron);
            border-radius: 6px;
            padding: 15px;
            padding-right: 45px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .article-card:hover {
            border-color: var(--border-gold);
            background-color: #201810;
        }
        .article-card.active {
            border-color: var(--border-gold);
            background-color: #2b2118;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .article-card-delete {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            opacity: 0.5;
            transition: all 0.2s;
            padding: 6px 8px;
            border-radius: 4px;
        }
        .article-card-delete:hover {
            color: #ef4444;
            background-color: rgba(239,68,68,0.15);
            opacity: 1;
        }

        /* Zone d'affichage principale */
        .sheet-container {
            flex: 1;
            background-color: var(--bg-table);
            height: 100%;
            overflow-y: auto;
            padding: 35px;
        }

        /* Fiche parchemin */
        .rpg-sheet {
            background-color: var(--bg-parchment);
            color: var(--text-dark);
            border: 1px solid #c8bda6;
            border-radius: 4px;
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
        }
        .rpg-header {
            background-color: #f0e8d0;
            border-bottom: 2px solid #c8bda6;
            padding: 25px 30px;
        }
        .rpg-meta {
            font-family: 'EB Garamond', serif;
            font-style: italic;
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #c8bda6;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .rpg-header-title {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.3;
        }
        .rpg-content {
            padding: 35px 40px;
            font-size: 1.1rem;
            line-height: 1.8;
            text-align: justify;
            white-space: pre-wrap;
            color: var(--text-dark);
        }

        /* Boutons médiévaux */
        .rpg-btn {
            background-color: var(--bg-input);
            border: 1px solid var(--border-iron);
            color: var(--text-light);
            padding: 8px 16px;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            text-decoration: none;
        }
        .rpg-btn:hover {
            border-color: var(--border-gold);
            color: var(--border-gold);
            background-color: rgba(195,161,99,0.1);
        }
        .rpg-btn-primary {
            background-color: var(--border-gold);
            border-color: var(--border-gold);
            color: #120e0a;
        }
        .rpg-btn-primary:hover { opacity: 0.85; }

        /* Modale */
        .rpg-modal {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(14,10,7,0.88);
            z-index: 500;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .rpg-modal-content {
            background-color: var(--bg-parchment);
            color: var(--text-dark);
            width: 100%;
            max-width: 650px;
            border: 2px solid var(--border-gold);
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            max-height: 90vh;
        }

        /* Inputs dans la modale */
        .parchment-input {
            background-color: rgba(0,0,0,0.04);
            border: 1px solid #c8bda6;
            color: var(--text-dark);
            font-family: 'EB Garamond', serif;
            padding: 8px 12px;
            border-radius: 4px;
            outline: none;
            font-size: 1.1rem;
            width: 100%;
            box-sizing: border-box;
        }
        .parchment-input:focus {
            border-color: var(--border-gold);
            background-color: rgba(0,0,0,0.02);
        }

        @media (max-width: 768px) {
            .main-wrapper { flex-direction: column; }
            .sidebar { width: 100%; height: 40%; border-right: none; border-bottom: 3px double var(--border-iron); }
            .sheet-container { height: 60%; padding: 15px; }
        }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden">

    <!-- EN-TÊTE UNIFIÉ -->
    <header class="app-header">
        <div class="flex items-center gap-3">
            <div>
                <h1 class="app-title">Chronique de l'Arche</h1>
                <p class="app-subtitle">Chroniqueur : Susan Anders</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
                <select id="mode-select" onchange="window.changeSyncMode(this.value)" class="parchment-input text-xs py-1.5 px-2 border-[#c3a163] bg-stone-900 text-amber-500 rounded font-serif cursor-pointer">
                    <option value="shared">Codex de la Table (Partagé)</option>
                    <option value="local">Codex Personnel (Local/Privé)</option>
                </select>
            </div>

            <a href="index.html" style="font-family:'Cinzel',serif; font-size:0.8rem; letter-spacing:0.05em; color:#c3a163; border:1px solid #c3a163; padding:6px 14px; border-radius:3px; text-decoration:none; transition:all 0.2s;" onmouseover="this.style.background='rgba(195,161,99,0.12)'" onmouseout="this.style.background='transparent'">
                <i class="fa-solid fa-dragon"></i> Bestiaire
            </a>
            <a href="GestionCombat.html" style="font-family:'Cinzel',serif; font-size:0.8rem; letter-spacing:0.05em; color:#c3a163; border:1px solid #c3a163; padding:6px 14px; border-radius:3px; text-decoration:none; transition:all 0.2s;" onmouseover="this.style.background='rgba(195,161,99,0.12)'" onmouseout="this.style.background='transparent'">
                <i class="fa-solid fa-sword"></i> Combat
            </a>

            <button onclick="window.toggleModal(true)" style="font-family:'Cinzel',serif; font-size:0.8rem; letter-spacing:0.05em; color:#120e0a; background:#c3a163; border:1px solid #c3a163; padding:6px 14px; border-radius:3px; cursor:pointer; transition:all 0.2s;" onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">
                <i class="fa-solid fa-feather-pointed"></i> Nouvel article
            </button>
        </div>
    </header>

    <!-- ZONE PRINCIPALE -->
    <div class="main-wrapper">
        
        <!-- SOMMAIRE GAUCHE -->
        <aside class="sidebar">
            <div class="sidebar-search">
                <input type="text" id="search-input" oninput="window.applyFilters()" placeholder="Trouver un article..." class="custom-input">
            </div>
            <div class="creatures-list" id="creatures-list">
                <!-- Dynamique -->
            </div>
        </aside>

        <!-- ESPACE DE LECTURE DROIT -->
        <main class="sheet-container">
            <div id="rpg-sheet-display" class="rpg-sheet">
                <!-- Contenu actif -->
            </div>
        </main>
    </div>

    <!-- BOITE DE DIALOGUE (REDACTION) -->
    <div id="write-modal" class="rpg-modal" onclick="if(event.target === this) window.toggleModal(false)">
        <div class="rpg-modal-content">
            <div style="padding:20px 25px; border-bottom:2px solid #c8bda6; display:flex; justify-content:space-between; align-items:center; background:#f0e8d0;">
                <h3 style="font-family:'Cinzel',serif; font-size:1.1rem; font-weight:700; color:var(--text-dark);">
                    <i class="fa-solid fa-feather-pointed" style="color:var(--border-gold); margin-right:8px;"></i>Rédiger une Chronique
                </h3>
                <button onclick="window.toggleModal(false)" style="background:transparent; border:none; color:var(--text-muted); cursor:pointer; font-size:1.2rem;">
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
            </div>
            <form id="chronicle-form" onsubmit="window.saveData(event)" style="padding:20px 25px; display:flex; flex-direction:column; gap:16px; overflow-y:auto;">
                <input type="hidden" id="form-id">

                <div style="display:flex; flex-direction:column; gap:6px;">
                    <label style="font-family:'Cinzel',serif; font-size:0.75rem; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em;">Titre de la Chronique</label>
                    <input type="text" id="form-title" required class="parchment-input" placeholder="Ex : Activité de la Chair à Rome…">
                </div>

                <div style="display:flex; flex-direction:column; gap:6px;">
                    <label style="font-family:'Cinzel',serif; font-size:0.75rem; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em;">Niveau d'urgence</label>
                    <select id="form-priority" class="parchment-input">
                        <option value="green">Rapport commun</option>
                        <option value="orange">À notifier</option>
                        <option value="red">Prioritaire</option>
                    </select>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                    <div style="display:flex; flex-direction:column; gap:6px;">
                        <label style="font-family:'Cinzel',serif; font-size:0.75rem; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em;">Auteur</label>
                        <input type="text" id="form-author" required class="parchment-input" placeholder="Ex : Coterie Cyclope">
                    </div>
                    <div style="display:flex; flex-direction:column; gap:6px;">
                        <label style="font-family:'Cinzel',serif; font-size:0.75rem; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em;">Date</label>
                        <input type="text" id="form-date" required class="parchment-input" placeholder="Ex : 11 Janvier 2038">
                    </div>
                </div>

                <div style="display:flex; flex-direction:column; gap:6px;">
                    <label style="font-family:'Cinzel',serif; font-size:0.75rem; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em;">Contenu</label>
                    <textarea id="form-content" required rows="10" class="parchment-input" style="resize:none;" placeholder="Consignez ici les faits rapportés par vos agents…"></textarea>
                </div>

                <div style="border-top:1px solid #c8bda6; padding-top:16px; display:flex; justify-content:flex-end; gap:10px;">
                    <button type="button" onclick="window.toggleModal(false)" class="rpg-btn">Annuler</button>
                    <button type="submit" class="rpg-btn rpg-btn-primary">
                        <i class="fa-solid fa-scroll"></i> Consigner
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL DE CONFIRMATION DE SUPPRESSION -->
    <div id="confirm-modal" style="display:none;" class="fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-[1000]">
        <div style="background:var(--bg-parchment); color:var(--text-dark); border:2px solid #b91c1c; border-radius:4px; padding:30px; max-width:380px; width:100%; text-align:center; box-shadow:0 0 30px rgba(0,0,0,0.8);">
            <i class="fa-solid fa-skull" style="font-size:2rem; color:#b91c1c; margin-bottom:12px; display:block;"></i>
            <h3 style="font-family:'Cinzel',serif; font-size:1.1rem; font-weight:700; margin-bottom:10px; color:#b91c1c;">Effacer la Chronique ?</h3>
            <p style="font-size:0.95rem; margin-bottom:24px; color:var(--text-muted); font-style:italic;">Cette action est irréversible. La chronique sera rayée du Codex.</p>
            <div style="display:flex; justify-content:center; gap:12px;">
                <button onclick="window.closeDeleteConfirmation()" class="rpg-btn">Conserver</button>
                <button onclick="window.confirmDelete()" class="rpg-btn" style="background:#b91c1c; border-color:#b91c1c; color:#faf4e5;">Effacer</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT APPLICATION SYNC ET LOGIQUE COMMUNE -->
    <script>
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'journal-susan';
        
        window.creatures = [];
        window.activeCreatureId = null;
        window.pendingDeleteId = null;

        // Sons héraldiques
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        window.playSound = function(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                osc2.connect(gain);
                gain.connect(audioCtx.destination);
                
                if (type === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime); // Mi (E4)
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(880, audioCtx.currentTime); // Octave
                    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                    osc.start(); osc2.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                    osc2.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'success') {
                    const osc3 = audioCtx.createOscillator();
                    osc3.connect(gain);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // Do
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.05); // Mi
                    osc3.type = 'sine';
                    osc3.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.1); // Sol
                    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                    osc.start(); osc2.start(); osc3.start();
                    osc.stop(audioCtx.currentTime + 0.5);
                    osc2.stop(audioCtx.currentTime + 0.5);
                    osc3.stop(audioCtx.currentTime + 0.5);
                }
            } catch (e) {
                console.warn(e);
            }
        };

        window.showToast = function(message) {
            const t = document.getElementById('toast');
            if (t) {
                t.textContent = message;
                t.style.display = 'block';
                setTimeout(() => { t.style.display = 'none'; }, 4000);
            }
        };

        window.changeSyncMode = function(mode) {
            window.playSound('click');
            localStorage.setItem(`knight_journal_mode_${appId}`, mode);
            window.location.reload();
        };

        // Ouverture / Fermeture Boite de dialogue
        window.toggleModal = function(show) {
            window.playSound('click');
            const m = document.getElementById('write-modal');
            if (m) {
                m.style.display = show ? 'flex' : 'none';
            }
            if (show) {
                const f = document.getElementById('chronicle-form');
                if (f) f.reset();
                document.getElementById('form-id').value = "";
            }
        };

        window.applyFilters = function() {
            window.renderList();
        };

        window.renderList = function() {
    const listContainer = document.getElementById('creatures-list');
    if (!listContainer) return;
    listContainer.innerHTML = "";

    const priorityColors = { 'red': '#ef4444', 'orange': '#f59e0b', 'green': '#00ff66' };
    const searchVal = document.getElementById('search-input')?.value.toLowerCase() || "";

    const filtered = window.creatures.filter(c => 
        (c.title || "").toLowerCase().includes(searchVal) || 
        (c.content || "").toLowerCase().includes(searchVal)
    );

    filtered.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

    filtered.forEach(c => {
        const prioLabel = { 'red': '#b91c1c', 'orange': '#c2410c', 'green': '#15803d' };
        const pColor = prioLabel[c.priority] || '#2a2015';
        const card = document.createElement('div');
        card.className = `article-card ${c.id === window.activeCreatureId ? 'active' : ''}`;
        card.onclick = () => { window.selectArticle(c.id); };

        card.innerHTML = `
            <div style="font-family:'Cinzel',serif; font-weight:700; font-size:0.9rem; color:${pColor}; margin-bottom:8px;">${c.title}</div>
            <div style="display:flex; justify-content:space-between; font-size:0.85rem; font-style:italic; color:var(--text-muted); font-family:'EB Garamond',serif;">
                <span>${c.author}</span>
                <span>${c.date}</span>
            </div>
            <button class="article-card-delete" onclick="event.stopPropagation(); window.showDeleteConfirmation('${c.id}');" title="Effacer la chronique">
                <i class="fa-solid fa-xmark"></i>
            </button>
        `;
        listContainer.appendChild(card);
    });
};

        window.selectArticle = function(id) {
            window.playSound('click');
            window.activeCreatureId = id;
            window.renderList();
            window.renderActiveSheet();
        };

        window.renderActiveSheet = function() {
    const container = document.getElementById('rpg-sheet-display');
    if (!container) return;
    
    let c = window.activeCreatureId ? window.creatures.find(item => item.id === window.activeCreatureId) : null;
    
    if (!c) {
        container.innerHTML = `<div style="padding:45px; text-align:center; font-style:italic; color:var(--text-muted); font-family:'EB Garamond',serif; font-size:1.1rem;">Aucune chronique sélectionnée</div>`;
        return;
    }

    const prioLabel = { 'red': 'Prioritaire', 'orange': 'À notifier', 'green': 'Rapport commun' };
    const prioColor = { 'red': '#b91c1c', 'orange': '#c2410c', 'green': '#15803d' };
    const pLabel = prioLabel[c.priority] || '';
    const pColor = prioColor[c.priority] || '#2a2015';

    container.innerHTML = `
        <div class="rpg-header">
            <div class="rpg-meta">
                <span>Par ${c.author}</span>
                <span>${c.date}</span>
            </div>
            <h2 class="rpg-header-title">${c.title}</h2>
            ${pLabel ? `<div style="margin-top:10px; display:inline-block; font-family:'Cinzel',serif; font-size:0.75rem; font-weight:600; color:${pColor}; border:1px solid ${pColor}; padding:3px 10px; border-radius:3px;">${pLabel}</div>` : ''}
        </div>
        <div class="rpg-content">${c.content}</div>
    `;
};

        window.showDeleteConfirmation = function(id) {
    window.pendingDeleteId = id;
    const modal = document.getElementById('confirm-modal');
    if (modal) modal.style.display = 'flex';
};

        window.closeDeleteConfirmation = function() {
            const modal = document.getElementById('confirm-modal');
            if (modal) modal.style.display = 'none';
            window.pendingDeleteId = null;
        };

        window.confirmDelete = async function() {
            if (window.pendingDeleteId) {
                await window.deleteCreature(window.pendingDeleteId);
            }
            window.closeDeleteConfirmation();
        };

        // Sauvegarde locale de secours
        window.saveCreature = async function(obj) {
            window.playSound('success');
            const docId = obj.id || crypto.randomUUID();
            obj.id = docId;
            obj.updatedAt = Date.now();

            const index = window.creatures.findIndex(c => c.id === docId);
            if (index > -1) {
                window.creatures[index] = obj;
            } else {
                window.creatures.push(obj);
            }

            localStorage.setItem(`knight_journal_local_${appId}`, JSON.stringify(window.creatures));
            window.activeCreatureId = docId;
            window.showToast("Rapport consigné localement.");
            window.renderList();
            window.renderActiveSheet();
        };

        window.deleteCreature = async function(id) {
            window.playSound('click');
            window.creatures = window.creatures.filter(c => c.id !== id);
            localStorage.setItem(`knight_journal_local_${appId}`, JSON.stringify(window.creatures));
            window.showToast("Dossier purgé.");
            
            if (window.activeCreatureId === id) {
                if (window.creatures.length > 0) {
                    window.activeCreatureId = window.creatures[0].id;
                } else {
                    window.activeCreatureId = null;
                }
            }
            window.renderList();
            window.renderActiveSheet();
        };

        window.saveData = async function(event) {
            event.preventDefault();
            const obj = {
                id: document.getElementById('form-id').value || null,
                title: document.getElementById('form-title').value.trim(),
                author: document.getElementById('form-author').value.trim(),
                date: document.getElementById('form-date').value.trim(),
                content: document.getElementById('form-content').value.trim(),
                priority: document.getElementById('form-priority').value
            };

            window.toggleModal(false);
            await window.saveCreature(obj);
        };

        window.loadLocalFallback = function() {
            const raw = localStorage.getItem(`knight_journal_local_${appId}`);
            if (raw) {
                try {
                    window.creatures = JSON.parse(raw);
                } catch(e) {
                    window.creatures = [];
                }
            }

            if (!window.activeCreatureId && window.creatures.length > 0) {
                window.activeCreatureId = window.creatures[0].id;
            }
            window.renderList();
            window.renderActiveSheet();
        };

        // Chargement initial
        document.addEventListener('DOMContentLoaded', () => {
            const savedMode = localStorage.getItem(`knight_journal_mode_${appId}`) || 'shared';
            const selectElement = document.getElementById('mode-select');
            if (selectElement) selectElement.value = savedMode;

            const syncBadge = document.getElementById('sync-badge');
            if (syncBadge) {
                if (savedMode === 'shared') {
                    syncBadge.innerHTML = "<span class='w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping'></span>Codex Partagé";
                    syncBadge.className = "bg-stone-900 border border-amber-700/50 px-3 py-1 rounded text-[10px] font-serif text-amber-500 flex items-center gap-1.5";
                } else {
                    syncBadge.innerHTML = "<i class='fa-solid fa-feather'></i> Codex Local";
                    syncBadge.className = "bg-stone-900 border border-stone-700 px-2.5 py-1 rounded text-[10px] font-serif text-stone-400 flex items-center gap-1.5";
                }
            }
            
            window.loadLocalFallback();
        });
    </script>

    <!-- MODULE FIREBASE PARTAGÉ ASYNC (OPTIONNEL) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Définition de l'ID unique pour cette page
        const localAppId = typeof __app_id !== 'undefined' ? __app_id : 'journal-susan';
        let db = null;
        let auth = null;

        const baseLocalSave = window.saveCreature;
        window.saveCreature = async function(obj) {
            window.playSound('success');
            const savedMode = localStorage.getItem(`knight_journal_mode_${localAppId}`) || 'shared';
            
            if (savedMode === 'shared' && db && auth && auth.currentUser) {
                try {
                    const docId = obj.id || crypto.randomUUID();
                    obj.id = docId;
                    obj.updatedAt = Date.now();
                    // Utilisation de localAppId pour isoler les données de cette page
                    const ref = doc(db, 'artifacts', localAppId, 'public', 'data', 'journals', docId);
                    await setDoc(ref, obj);
                    window.activeCreatureId = docId;
                    window.showToast("Chronique envoyée au terminal central.");
                } catch (e) {
                    console.error("Save error, fallback to local:", e);
                    baseLocalSave(obj);
                }
            } else {
                baseLocalSave(obj);
            }
        };

        const baseLocalDelete = window.deleteCreature;
        window.deleteCreature = async function(id) {
            window.playSound('click');
            const savedMode = localStorage.getItem(`knight_journal_mode_${localAppId}`) || 'shared';
            
            if (savedMode === 'shared' && db && auth && auth.currentUser) {
                try {
                    const ref = doc(db, 'artifacts', localAppId, 'public', 'data', 'journals', id);
                    const currentItem = window.creatures.find(item => item.id === id);
                    if (currentItem) {
                        await setDoc(ref, { ...currentItem, deleted: true });
                        window.showToast("Signal purgé de l'Arche.");
                    }
                    if (window.activeCreatureId === id) {
                        window.activeCreatureId = null;
                    }
                } catch (e) {
                    console.error("Firestore error, fallback to local:", e);
                    baseLocalDelete(id);
                }
            } else {
                baseLocalDelete(id);
            }
        };

        function listenToDatabase() {
            const ref = collection(db, 'artifacts', localAppId, 'public', 'data', 'journals');
            const q = query(ref);

            onSnapshot(q, (snap) => {
                const data = [];
                snap.forEach((doc) => {
                    const docData = doc.data();
                    if (docData && !docData.deleted) {
                        data.push({ id: doc.id, ...docData });
                    }
                });
                window.creatures = data;
                
                if (window.activeCreatureId && !window.creatures.some(c => c.id === window.activeCreatureId)) {
                    window.activeCreatureId = null;
                }
                if (!window.activeCreatureId && window.creatures.length > 0) {
                    window.activeCreatureId = window.creatures[0].id;
                }
                
                window.renderList();
                window.renderActiveSheet();

                const syncBadge = document.getElementById('sync-badge');
                if (syncBadge && localStorage.getItem(`knight_journal_mode_${localAppId}`) !== 'local') {
                    syncBadge.innerHTML = "<span class='w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping'></span>Codex Partagé";
                    syncBadge.className = "bg-stone-900 border border-amber-700/50 px-3 py-1 rounded text-[10px] font-serif text-amber-500 flex items-center gap-1.5";
                }
            }, (err) => {
                console.error("Sync failed:", err);
                window.loadLocalFallback();
            });
        }

        async function init() {
            const savedMode = localStorage.getItem(`knight_journal_mode_${localAppId}`) || 'shared';
            const selectElem = document.getElementById('mode-select');
            if (selectElem) selectElem.value = savedMode;

            if (savedMode === 'shared') {
                try {
                    const config = {
                        apiKey: "AIzaSyAbFhzscxcmUoZ9HnEawJLa0JiCmFayg60",
                        authDomain: "knight-c719f.firebaseapp.com",
                        projectId: "knight-c719f",
                        storageBucket: "knight-c719f.firebasestorage.app",
                        messagingSenderId: "605627921243",
                        appId: "1:605627921243:web:3a1d1e618c51d5d6bea07e"
                    };
                    const app = initializeApp(config);
                    db = getFirestore(app);
                    auth = getAuth(app);

                    // Connexion silencieuse à la base de données
                    await signInAnonymously(auth);
                    
                    // Écoute de l'état de connexion pour lancer la synchronisation
                    onAuthStateChanged(auth, (user) => {
                        if (user) {
                            listenToDatabase();
                        } else {
                            window.loadLocalFallback();
                        }
                    });

                } catch (e) {
                    console.error("Firebase init failed:", e);
                    window.loadLocalFallback();
                }
            } else {
                window.loadLocalFallback();
            }
        }

        init();
    </script>
